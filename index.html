<title>Birthday Quiz #26</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg: #0e1016;
    --bg-2: #171a23;
    --card: #1b1e29;
    --text: #f2ede0;
    --text-dim: #9a95a6;
    --rule: rgba(242,237,224,0.14);
    --gold: #e6b23e;
    --gold-dim: rgba(230,178,62,0.16);
    --teal: #45ad9f;
    --teal-dim: rgba(69,173,159,0.16);
    --accent: var(--text-dim);
    --shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 10px 24px -12px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  img{max-width:100%;}

  .app{
    position:relative;
    height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    padding:0 clamp(16px, 4vw, 40px);
    padding-block: max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-bottom,0px));
    background:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(242,237,224,0.05), transparent 60%),
      var(--bg);
  }

  /* ---------- header chrome ---------- */
  .chrome{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-block: 6px 14px;
    flex-shrink:0;
    gap:12px;
  }
  .brand{
    font-family:"IBM Plex Mono", monospace;
    font-size: 0.78rem;
    font-weight:500;
    letter-spacing: 0.16em;
    color: var(--text-dim);
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand b{color:var(--text); font-weight:600;}
  .brand .sep{color: var(--accent); transition: color .3s ease;}
  .chrome-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .round-picker{ position:relative; }
  .round-tag{
    appearance:none;
    -webkit-appearance:none;
    font-family:"IBM Plex Mono", monospace;
    font-size:0.68rem;
    letter-spacing:0.12em;
    color:var(--text-dim);
    background:transparent;
    padding:4px 10px;
    border:1px solid var(--rule);
    border-radius:999px;
    white-space:nowrap;
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease, background .2s ease;
  }
  .round-tag:hover,
  .round-tag[aria-expanded="true"]{
    border-color:var(--accent);
    color:var(--text);
    background:rgba(242,237,224,0.05);
  }
  .round-menu{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    width:max-content;
    min-width:210px;
    max-width:min(84vw, 300px);
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:2px;
    z-index:20;
  }
  .round-menu[hidden]{ display:none; }
  .round-menu-item{
    appearance:none;
    -webkit-appearance:none;
    border:none;
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:9px 12px;
    border-radius:9px;
    cursor:pointer;
    display:flex;
    align-items:baseline;
    gap:10px;
    font-family:"IBM Plex Sans", sans-serif;
    font-size:0.85rem;
    line-height:1.3;
    transition: background .15s ease;
  }
  .round-menu-item:hover,
  .round-menu-item:focus-visible{
    background:rgba(242,237,224,0.07);
    outline:none;
  }
  .round-menu-item .rn{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.7rem;
    color:var(--text-dim);
    flex-shrink:0;
  }
  .round-menu-item.current .rn{ color:var(--gold); }
  .round-menu-item.current .rl{ font-weight:600; }
  .counter{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.78rem;
    letter-spacing:0.1em;
    color:var(--text-dim);
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }
  .fs-btn{
    appearance:none; border:1px solid var(--rule); background:transparent;
    color:var(--text-dim); width:30px; height:30px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:0.85rem; line-height:1;
    transition: border-color .2s ease, color .2s ease;
    flex-shrink:0;
  }
  .fs-btn:hover{ border-color: var(--accent); color: var(--text); }

  .accent-rule{
    height:2px; flex-shrink:0; border-radius:2px;
    background: var(--accent);
    opacity:0.7;
    transition: background-color .35s ease;
  }

  /* ---------- stage ---------- */
  .stage{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .slide{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* text-only slides (title / divider / end) */
  .text-slide{
    flex-direction:column;
    text-align:center;
    gap:clamp(14px,3vh,28px);
  }
  .headline{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:clamp(2.2rem, 9vw, 5.4rem);
    line-height:1.02;
    letter-spacing:-0.01em;
    text-wrap:balance;
    margin:0;
  }
  .headline.small{
    font-size:clamp(1.7rem, 7.2vw, 3.8rem);
  }
  .codeline{
    font-family:"IBM Plex Mono", monospace;
    font-weight:500;
    font-size:clamp(1.1rem, 4.4vw, 2rem);
    letter-spacing:0.02em;
    color:var(--text-dim);
    max-width:min(88vw, 720px);
    text-wrap:balance;
  }
  .codeline .cha{color:var(--gold);}
  .codeline .gal{color:var(--teal);}
  .codeline .quote{color:var(--text-dim); font-weight:400;}
  .divider-eyebrow{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.8rem;
    letter-spacing:0.24em;
    color:var(--text-dim);
  }
  .round-rule{
    font-family:"IBM Plex Sans", sans-serif;
    font-size:clamp(0.85rem, 2.4vw, 1rem);
    color:var(--text-dim);
    font-style:italic;
    max-width:min(80vw, 480px);
  }

  /* ---------- quiz slides (question / answer) ---------- */
  .quiz-slide{
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
    width:100%;
    gap:clamp(12px,2.2vh,22px);
    padding-block:4px;
    padding-inline:clamp(50px, 9vw, 72px);
    min-height:0;
  }
  .q-card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:760px;
    max-height:100%;
    min-height:0;
    overflow-y:auto;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:clamp(20px,4vw,36px) clamp(20px,4.6vw,42px);
    display:flex;
    flex-direction:column;
    gap:clamp(10px,1.8vh,16px);
    scrollbar-width:thin;
  }
  .quiz-slide.has-image .q-card{
    flex:0 1 auto;
  }
  .q-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-shrink:0;
  }
  .q-top.solo{ justify-content:flex-end; }
  .term-badge{
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:clamp(0.66rem, 1.7vw, 0.8rem);
    letter-spacing:0.1em;
    padding:6px 13px;
    border-radius:10px;
    border:1px solid var(--rule);
    background:rgba(242,237,224,0.04);
    color:var(--text-dim);
    text-align:center;
    white-space:normal;
  }
  .term-badge.q{ color:var(--gold); border-color:rgba(230,178,62,0.5); background:var(--gold-dim); }
  .term-badge.a{ color:var(--teal); border-color:rgba(69,173,159,0.5); background:var(--teal-dim); }
  .q-index{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.75rem;
    letter-spacing:0.16em;
    color:var(--text-dim);
    flex-shrink:0;
  }

  /* track bar (metal round: band + song + play button) */
  .track-bar{
    display:flex;
    align-items:center;
    gap:14px;
    padding-bottom:clamp(12px,2vh,16px);
    margin-bottom:2px;
    border-bottom:1px dashed var(--rule);
    flex-shrink:0;
  }
  .play-btn{
    flex-shrink:0;
    width:46px; height:46px;
    border-radius:50%;
    border:1px solid var(--rule);
    background:rgba(242,237,224,0.04);
    color:var(--text);
    font-size:0.95rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease, color .2s ease, transform .15s ease;
  }
  .play-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .play-btn:active{ transform:scale(0.94); }
  .play-btn.is-playing{ background:var(--accent); color:var(--card); border-color:var(--accent); }
  .track-hint{
    font-family:"IBM Plex Mono", monospace;
    font-weight:500;
    font-size:0.72rem;
    letter-spacing:0.18em;
    color:var(--text-dim);
  }

  .q-body{
    font-size:clamp(0.94rem, 2.1vw, 1.15rem);
    line-height:1.58;
  }
  .q-body p{ margin:0 0 0.75em 0; }
  .q-body p:last-child{ margin-bottom:0; }
  .q-ask{
    color:var(--text);
    font-weight:400;
  }
  .q-note{
    font-family:"IBM Plex Sans", sans-serif;
    font-size:0.85rem;
    color:var(--text-dim);
    font-style:italic;
    margin-top:-0.3em;
  }
  .q-quote{
    margin:0.4em 0;
    padding:0.2em 0 0.2em 1em;
    border-left:2px solid var(--rule);
    font-style:italic;
    color:var(--text-dim);
    font-size:0.94em;
    line-height:1.6;
  }

  /* myth / testimony / document card (Athena, Tool, Hong Kong) */
  .myth-card{
    position:relative;
    border:1px solid rgba(230,178,62,0.3);
    border-radius:3px 12px 12px 12px;
    padding:clamp(20px,3.2vw,26px) clamp(16px,2.8vw,22px) clamp(16px,2.6vw,20px);
    background: rgba(230,178,62,0.035);
    margin-top:14px;
  }
  .myth-tab{
    position:absolute;
    top:-15px; left:16px;
    background:var(--card);
    border:1px solid rgba(230,178,62,0.3);
    border-bottom:none;
    padding:4px 12px 13px;
    border-radius:8px 8px 0 0;
    font-family:"IBM Plex Mono", monospace;
    font-size:0.6rem;
    font-weight:600;
    letter-spacing:0.16em;
    color:var(--gold);
  }
  .myth-sub{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.66rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:0.9em;
    padding-bottom:0.7em;
    border-bottom:1px dashed var(--rule);
  }
  .clue-label{
    font-family:"IBM Plex Mono", monospace;
    font-weight:400;
    letter-spacing:0.04em;
    color:var(--gold);
  }
  .myth-card p{ margin:0 0 0.6em 0; }
  .myth-card p:last-of-type{ margin-bottom:0; }
  .myth-aside{
    margin-top:0.8em !important;
    font-style:italic;
    color:var(--text-dim);
    font-size:0.88em;
  }

  /* case file (psych: Batman) */
  .case-file{
    position:relative;
    border:1px solid rgba(230,178,62,0.3);
    border-radius:3px 12px 12px 12px;
    padding:clamp(20px,3.2vw,26px) clamp(16px,2.8vw,22px) clamp(16px,2.6vw,20px);
    background:
      repeating-linear-gradient(0deg, rgba(242,237,224,0.025) 0px, rgba(242,237,224,0.025) 1px, transparent 1px, transparent 28px),
      rgba(230,178,62,0.035);
    margin-top:14px;
  }
  .case-file-tab{
    position:absolute;
    top:-15px; left:16px;
    background:var(--card);
    border:1px solid rgba(230,178,62,0.3);
    border-bottom:none;
    padding:4px 12px 13px;
    border-radius:8px 8px 0 0;
    font-family:"IBM Plex Mono", monospace;
    font-size:0.6rem;
    font-weight:600;
    letter-spacing:0.16em;
    color:var(--gold);
  }
  .case-file-stamp{
    position:absolute;
    top:14px; right:14px;
    transform:rotate(-8deg);
    border:2px solid rgba(198,90,80,0.7);
    color:rgba(216,110,100,0.85);
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:0.62rem;
    letter-spacing:0.1em;
    padding:3px 9px;
    border-radius:5px;
    opacity:0.9;
    white-space:nowrap;
  }
  .case-file-title{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:clamp(0.92rem, 3.6vw, 1.05rem);
    color:var(--text);
    margin-bottom:0.15em;
    padding-right:78px;
  }
  .case-file-sub{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.66rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:0.9em;
    padding-bottom:0.7em;
    border-bottom:1px dashed var(--rule);
  }
  .redacted{
    display:inline-block;
    background:#0a0a0d;
    color:transparent;
    border-radius:2px;
    padding:0 5px;
    user-select:none;
  }
  .case-file p{ margin:0 0 0.6em 0; }
  .case-file ul{ margin:0 0 0.6em 0; padding-left:1.15em; }
  .case-file li{ margin-bottom:0.4em; }
  .case-file li:last-child{ margin-bottom:0; }
  .cf-label{
    font-family:"IBM Plex Mono", monospace;
    font-weight:400;
    letter-spacing:0.04em;
    color:var(--gold);
  }
  .case-file-sign{
    margin-top:0.8em;
    text-align:right;
    font-style:italic;
    color:var(--text-dim);
    font-size:0.88em;
  }

  .answer-tag{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.75rem;
    letter-spacing:0.2em;
    color: var(--accent);
    flex-shrink:0;
  }
  .name{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:clamp(1.5rem, 4.6vw, 2.5rem);
    line-height:1.12;
    margin:0;
    text-wrap:balance;
    flex-shrink:0;
  }
  .credit{
    font-family:"IBM Plex Sans", sans-serif;
    font-size:0.95rem;
    color:var(--text-dim);
    line-height:1.5;
  }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:2px 0 4px;
  }
  .chip{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.78rem;
    letter-spacing:0.05em;
    color:var(--text);
    background:var(--teal-dim);
    border:1px solid rgba(69,173,159,0.4);
    padding:5px 12px;
    border-radius:999px;
  }

  /* image frames used as clue support */
  .frame-row{
    display:flex;
    gap:10px;
    width:100%;
    max-width:640px;
    flex:1 1 auto;
    min-height:0;
    justify-content:center;
  }
  .frame-half{
    position:relative;
    flex:1 1 0;
    min-width:0;
    aspect-ratio: 4 / 5;
    max-height: min(38vh, 340px);
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    border:1px solid var(--rule);
  }
  .frame-half img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  .frame-single{
    position:relative;
    width:100%;
    max-width:320px;
    flex:0 1 auto;
    min-height:0;
    max-height:min(48vh, 440px);
    aspect-ratio: 650 / 801;
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    border:1px solid var(--rule);
  }
  .frame-single img{
    width:100%; height:100%;
    object-fit:contain;
    object-position:50% 50%;
    background:#fff;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  .frame-wide{
    position:relative;
    width:100%;
    max-width:640px;
    max-height:min(40vh, 360px);
    aspect-ratio: 16 / 9;
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    border:1px solid var(--rule);
    flex:0 1 auto;
    min-height:0;
  }
  .frame-wide img{
    width:100%; height:100%;
    object-fit:contain;
    object-position:50% 50%;
    background:#e8e2d0;
    box-sizing:border-box;
    padding:5%;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  .frame-wide-alt{
    position:relative;
    width:100%;
    max-width:640px;
    max-height:min(42vh, 380px);
    aspect-ratio: 2720 / 1840;
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    border:1px solid var(--rule);
    flex:0 1 auto;
    min-height:0;
  }
  .frame-wide-alt img{
    width:100%; height:100%;
    object-fit:contain;
    object-position:50% 50%;
    background:#fff;
    box-sizing:border-box;
    padding:2%;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  .frame-portrait{
    position:relative;
    width:100%;
    max-width:260px;
    flex:0 1 auto;
    min-height:0;
    max-height:min(46vh, 400px);
    aspect-ratio: 3 / 4;
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    border:1px solid var(--rule);
  }
  .frame-landscape{
    position:relative;
    width:100%;
    max-width:420px;
    flex:0 1 auto;
    min-height:0;
    max-height:min(40vh, 340px);
    aspect-ratio: 3 / 2;
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    border:1px solid var(--rule);
  }
  .frame-portrait img, .frame-landscape img{
    width:100%; height:100%;
    object-fit:cover;
    object-position:50% 30%;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  .panel-tag{
    position:absolute;
    left:6px; right:6px; bottom:6px;
    font-family:"IBM Plex Mono", monospace;
    font-size:0.62rem;
    line-height:1.3;
    letter-spacing:0.06em;
    text-transform:uppercase;
    text-align:center;
    color:var(--text-dim);
    background:rgba(14,16,22,0.66);
    backdrop-filter: blur(4px);
    padding:5px 6px;
    border-radius:7px;
  }

  /* ---------- picture-guessing slides (CHA-GAL Matrix round) ---------- */
  .pic-slide{
    flex-direction:column;
    gap:clamp(14px,2.4vh,22px);
    height:100%;
    padding-block: 4px;
  }
  .frame-wrap{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    position:relative;
    height:100%;
    max-height: min(64vh, 620px);
    aspect-ratio: 4 / 5;
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    border:1px solid var(--rule);
  }
  .frame img{
    width:100%; height:100%;
    object-fit:cover;
    object-position: 50% 16%;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  .chagal-frame-dual{
    display:flex;
    gap:10px;
    width:min(94vw, 640px);
    max-height: min(64vh, 620px);
  }
  .chagal-frame-half{
    position:relative;
    flex:1 1 0;
    min-width:0;
    aspect-ratio: 4 / 5;
    max-height: min(64vh, 620px);
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    border:1px solid var(--rule);
  }
  .chagal-frame-half img{
    width:100%; height:100%;
    object-fit:cover;
    object-position: 50% 16%;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  .chagal-frame-half.works img{
    object-fit:contain;
    object-position: 50% 50%;
    background:#e8e2d0;
    box-sizing:border-box;
    padding:12%;
  }
  .badge{
    position:absolute;

    { term:"CONSCIENCE",
      body:["One therapist — renowned for her work with antisocial clients — recalls this exchange with a court-remanded car thief:"],
      quote:"“The man was explaining to me how brilliant his scheme had been for the heist he had almost pulled off, how if only one little unforeseen thing hadn't happened, it would have been the perfect crime. Eventually he got so carried away that he asked, ‘Would you do something like that?’\n‘No,’ I answered.\n‘Why not?’ he asked, a little deflated.\n‘Two reasons,’ I said. ‘First, there is always some little thing that can go wrong, even with a brilliant plan. Life isn't that controllable. And second, I wouldn't — because I have something that you don't: THIS.’\n‘Yeah,’ he said. ‘You know how I could get one of those?’”",
      ask:"The author of this question has THIS and feels bad about you struggling with only one hint, so here is another one: Pinocchio's companion Jiminy Cricket literally represents THIS concept.",
      answer:"Conscience",
      credit:"What the antisocial client lacked — and what Jiminy Cricket was written to embody." },

    { term:"HIPPOCAMPUS",
      body:["This temporal-lobe structure encodes new declarative and spatial memories and consolidates them for long-term storage in the cortex.", "It is highly sensitive to chronic stress and cortisol — showing reduced volume in depression, PTSD and prolonged stress — making it a key target of therapies aimed at reversing stress-related atrophy."],
      images:[
        { src:"assets/psych_hippocampus.jpg", label:"Highlighted in red — in the brain, and in its Greek namesake", alt:"Diagrams of the hippocampus in the brain and a seahorse, both highlighted in red", frame:"wide" }
      ],
      answer:"Hippocampus",
      credit:"Named — and shaped — for the seahorse: Greek hippokampos." },

    { term:"SOMATIZATION",
      body:["Somatization is the process by which psychological distress shows up as physical symptoms."],
      ask:"In which 1932 dystopia — written by Aldous Huxley — is soma a legally mandated recreational drug, used by the World State to keep citizens docile, distracted and emotionally numb?",
      answer:"Brave New World",
      credit:"Huxley's soma keeps the World State's citizens blissfully, chemically compliant." },

    { term:"COMPARTMENTALIZATION",
      body:["Compartmentalization is a defense mechanism: separating conflicting thoughts, emotions or experiences into distinct mental categories to avoid anxiety or cognitive dissonance."],
      ask:"What is the maximum weight most low-cost airlines allow for an overhead-compartment bag?",
      answer:"10 kg",
      credit:"Give or take — most budget carriers cap cabin bags around 10 kg." },

    { term:"HYPNOSIS",
      body:["Hypnotherapy uses guided hypnosis to bring on a state of deep relaxation and focused concentration."],
      ask:"It takes its name from Hypnos, the Greek god of what?",
      answer:"Sleep",
      credit:"Hypnos — twin brother of Thanatos, Death — personified sleep itself." },

    { term:"DISPLACEMENT",
      body:["Displacement redirects a drive, emotion or impulse from its original — anxiety-inducing — target onto a safer one."],
      ask:"What's the name of one of the earliest documented examples, from Leviticus: an animal symbolically loaded with the sins of the people, then driven into the wilderness as part of the Yom Kippur ceremony?",
      answer:"Scapegoat",
      credit:"The literal origin of the word we still use for displaced blame." },

    { term:"STIGMA",
      body:["This word originally named a physical mark — burned or cut into the skin of slaves, criminals or traitors in Ancient Greece — to permanently signal disgrace. It derives from a Greek word meaning “to prick” or “tattoo.”", "Today it no longer involves branding, but still names a mark of shame or disgrace, often attached to mental illness, disease or social difference."],
      answer:"Stigma",
      credit:"From literal brand to metaphorical one — the word never lost its sting." },

    { term:"REPETITION COMPULSION",
      caseFile:{
        note:"adult male, wealthy, unsupervised. Witnessed parents' murder at age 8; never sought therapy — chose costumed vigilantism instead. Classic repetition compulsion.",
        items:[
          ["Sublimation", "rage → gadgets and a concerning fitness routine"],
          ["Displacement", "hatred of one killer → entire city's criminal population"],
          ["Reaction formation", "carefree playboy by day masks punishing avenger by night"],
          ["Attachment", "avoidant; collects young wards, possibly trying to become the father he lost"]
        ],
        closing:"Refuses medication, therapy, or retiring the cape. Unusually attached to a cave.",
        sign:"— attending psychotherapist, private session notes"
      },
      answer:"Batman",
      credit:"Gotham's most over-defended patient." },
  ];

  /* ================= ROUNDS TABLE ================= */
  const ROUNDS = [
    { key:"sept26", kind:"quiz", label:"September 26th",
      brand:'<b>SEP</b><span class="sep" id="brandSep">·</span><b>26</b> ROUND',
      title:'<div class="slide text-slide">'
        + '<div class="divider-eyebrow">THIS DAY IN HISTORY · 10 QUESTIONS</div>'
        + '<h1 class="headline">September 26th</h1>'
        + '<div class="round-rule">Ten unconnected events, one calendar date — scattered across nearly 450 years.</div>'
        + '</div>',
      questions:SEPT26_QUESTIONS },

    { key:"uroboros", kind:"quiz", label:"Uroboros",
      brand:'<b>URO</b><span class="sep" id="brandSep">·</span><b>BOROS</b> ROUND',
      title:'<div class="slide text-slide">'
        + '<div class="divider-eyebrow">PICTURE + TRIVIA ROUND · 10 QUESTIONS</div>'
        + '<h1 class="headline">Uroboros</h1>'
        + '<div class="codeline"><span class="quote">“</span>the snake that eats its own tail<span class="quote">”</span></div>'
        + '<div class="round-rule">All answers in this round begin and end with the same letter.</div>'
        + '</div>',
      questions:UROBOROS_QUESTIONS },

    { key:"metal", kind:"quiz", label:"Not only metal bands",
      brand:'<b>NOT</b><span class="sep" id="brandSep">·</span><b>METAL</b> ROUND',
      title:'<div class="slide text-slide">'
        + '<div class="divider-eyebrow">PICTURE + AUDIO ROUND · 10 QUESTIONS</div>'
        + '<h1 class="headline">Not only names<br>of metal bands</h1>'
        + '<div class="round-rule">Every band below shares its name with something else entirely — hear the clip, then name the other thing.</div>'
        + '</div>',
      questions:METAL_QUESTIONS },

    { key:"chagal", kind:"picture", label:"Matrix — CHA·GAL",
      brand:'<b>CHA</b><span class="sep" id="brandSep">·</span><b>GAL</b> MATRIX',
      title:'<div class="slide text-slide">'
        + '<div class="divider-eyebrow">WHO IS THIS · 10 QUESTIONS</div>'
        + '<h1 class="headline">Matrix</h1>'
        + '<div class="codeline"><span class="quote">“</span><span class="cha">-CHA-</span> <span class="gal">-GAL-</span><span class="quote">”</span></div>'
        + '<div class="round-rule">Every name below hides one of these two syllables.</div>'
        + '</div>',
      questions:CHAGAL_PEOPLE },

    { key:"psych", kind:"quiz", label:"Not only psychoanalytic diagnosis",
      brand:'<b>PSYCH</b><span class="sep" id="brandSep">·</span><b>DX</b> QUIZ',
      title:'<div class="slide text-slide">'
        + '<div class="divider-eyebrow">PICTURE + TERM ROUND · 10 QUESTIONS</div>'
        + '<h1 class="headline small">Not only terms</h1>'
        + '<div class="codeline"><span class="quote">“</span>from Psychoanalytic Diagnosis<span class="quote">”</span></div>'
        + '</div>',
      questions:PSYCH_QUESTIONS },
  ];

  const ROUND_LEN = 22; // title + 10 q + divider + 10 a, same shape for every round
  const roundStart = ROUNDS.map((_,i) => i * ROUND_LEN);

  const SLIDES = [];
  ROUNDS.forEach((r, ri) => {
    SLIDES.push({type:'title', ri});
    r.questions.forEach((q,i) => SLIDES.push({type:'q', ri, q, n:i+1}));
    SLIDES.push({type:'divider', ri});
    r.questions.forEach((q,i) => SLIDES.push({type:'a', ri, q, n:i+1}));
  });
  SLIDES.push({type:'end'});

  const stage = document.getElementById('stage');
  const counter = document.getElementById('counter');
  const dotsEl = document.getElementById('dots');
  const hintEl = document.getElementById('hintEl');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const accentRule = document.getElementById('accentRule');
  const brandEl = document.getElementById('brandEl');
  const roundTag = document.getElementById('roundTag');
  const roundMenu = document.getElementById('roundMenu');
  const app = document.getElementById('app');
  const fsBtn = document.getElementById('fsBtn');

  let idx = 0;

  const player = new Audio();
  let playerTrack = null;
  const PLAY_ICON = '▶';
  const PAUSE_ICON = '❘❘';

  function updatePlayButton(){
    const btn = stage.querySelector('.play-btn');
    if (!btn) return;
    const isThisTrack = btn.dataset.track === playerTrack;
    const isPlaying = isThisTrack && !player.paused && !player.ended;
    btn.classList.toggle('is-playing', isPlaying);
    btn.textContent = isPlaying ? PAUSE_ICON : PLAY_ICON;
  }
  player.addEventListener('play', updatePlayButton);
  player.addEventListener('pause', updatePlayButton);
  player.addEventListener('ended', updatePlayButton);

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function paras(lines){
    return (lines||[]).map(t => '<p>' + esc(t) + '</p>').join('');
  }

  function quoteBlock(text){
    if (!text) return '';
    const html = esc(text).split('\n').join('<br>');
    return '<blockquote class="q-quote">' + html + '</blockquote>';
  }

  function mythBlock(m){
    if (!m) return '';
    const sep = m.sep || '.';
    let html = '<div class="myth-card">';
    html += '<div class="myth-tab">' + esc(m.tab) + '</div>';
    if (m.sub) html += '<div class="myth-sub">' + esc(m.sub) + '</div>';
    html += m.rows.map(([k,v]) => '<p><span class="clue-label">' + esc(k) + sep + '</span> ' + esc(v) + '</p>').join('');
    if (m.aside) html += '<p class="myth-aside">' + esc(m.aside) + '</p>';
    html += '</div>';
    return html;
  }

  function caseFileBlock(cf){
    if (!cf) return '';
    let html = '<div class="case-file">';
    html += '<div class="case-file-tab">CASE FILE</div>';
    html += '<div class="case-file-stamp">CONFIDENTIAL</div>';
    html += '<div class="case-file-title">Clinical Notes</div>';
    html += '<div class="case-file-sub">Private practice — session summary</div>';
    html += '<p><span class="cf-label">Patient:</span> <span class="redacted">REDACTED&nbsp;&nbsp;&nbsp;&nbsp;</span> — ' + esc(cf.note) + '</p>';
    html += '<ul>' + cf.items.map(([k,v]) => '<li><span class="cf-label">' + esc(k) + ':</span> ' + esc(v) + '</li>').join('') + '</ul>';
    html += '<p>' + esc(cf.closing) + '</p>';
    if (cf.sign) html += '<div class="case-file-sign">' + esc(cf.sign) + '</div>';
    html += '</div>';
    return html;
  }

  function chipsBlock(examples){
    if (!examples || !examples.length) return '';
    return '<div class="chip-row">' + examples.map(e => '<span class="chip">' + esc(e) + '</span>').join('') + '</div>';
  }

  function tag(label){
    return label ? '<div class="panel-tag">' + esc(label) + '</div>' : '';
  }

  const FRAME_CLASS = {
    wide:'frame-wide',
    'wide-alt':'frame-wide-alt',
    portrait:'frame-portrait',
    landscape:'frame-landscape',
    single:'frame-single'
  };

  function imagesBlock(images){
    if (!images || !images.length) return '';
    if (images.length > 1){
      return '<div class="frame-row">' + images.map(im =>
        '<div class="frame-half"><img src="' + im.src + '" alt="' + esc(im.alt) + '">' + tag(im.label) + '</div>'
      ).join('') + '</div>';
    }
    const im = images[0];
    const cls = FRAME_CLASS[im.frame] || 'frame-single';
    return '<div class="' + cls + '"><img src="' + im.src + '" alt="' + esc(im.alt) + '">' + tag(im.label) + '</div>';
  }

  function trackBarHTML(q){
    return '<div class="track-bar">'
      + '<button class="play-btn" data-track="' + esc(q.track) + '" aria-label="Play music clip">' + PLAY_ICON + '</button>'
      + '<div class="track-hint">PLAY THE CLIP</div>'
      + '</div>';
  }

  function dividerHTML(){
    return '<div class="slide text-slide">'
      + '<div class="divider-eyebrow">10 OF 10 REVEALED</div>'
      + '<h1 class="headline">Answers</h1>'
      + '</div>';
  }

  function endSlideHTML(){
    return '<div class="slide text-slide end-slide">'
      + '<div class="divider-eyebrow">BIRTHDAY QUIZ #26</div>'
      + '<div class="end-frame"><img src="assets/finale_photo.jpg" alt="A birthday memory — a grinning kid with a red-stained face and hands, holding a spoon"></div>'
      + '<h1 class="end-headline">Thank you for being here today with me!</h1>'
      + '</div>';
  }

  function quizSlideHTML(s){
    const q = s.q;
    const phase = s.type; // 'q' or 'a'
    const images = phase === 'a' ? (q.answerImages || q.images) : q.images;
    const hasImage = !!(images && images.length);
    const idxTag = '<div class="q-index">' + (phase === 'q' ? 'Q' : 'A') + String(s.n).padStart(2,'0') + '</div>';

    let cardInner;
    if (phase === 'a' && q.term){
      cardInner = '<div class="q-top"><div class="term-badge a">' + esc(q.term) + '</div>' + idxTag + '</div>';
    } else {
      cardInner = '<div class="q-top solo">' + idxTag + '</div>';
    }

    if (q.track) cardInner += trackBarHTML(q);

    if (phase === 'q'){
      cardInner += '<div class="q-body">';
      if (q.myth){
        cardInner += mythBlock(q.myth);
      } else if (q.caseFile){
        cardInner += caseFileBlock(q.caseFile);
      } else {
        cardInner += paras(q.body);
        cardInner += quoteBlock(q.quote);
        if (q.ask) cardInner += '<p class="q-ask">' + esc(q.ask) + '</p>';
        if (q.note) cardInner += '<p class="q-note">' + esc(q.note) + '</p>';
      }
      cardInner += '</div>';
    } else {
      cardInner += '<div class="answer-tag">' + esc(q.answerTag || 'ANSWER') + '</div>'
        + '<h2 class="name">' + esc(q.answer) + '</h2>'
        + chipsBlock(q.examples)
        + '<div class="credit">' + esc(q.credit) + '</div>';
    }

    const card = '<div class="q-card">' + cardInner + '</div>';
    const frame = hasImage ? imagesBlock(images) : '';

    return '<div class="slide quiz-slide' + (hasImage ? ' has-image' : '') + '">'
      + card
      + frame
      + '<div class="click-zone left" data-dir="-1"></div>'
      + '<div class="click-zone right" data-dir="1"></div>'
      + '</div>';
  }

  function chagalSlideHTML(s){
    const p = s.q;
    const catClass = p.cat.toLowerCase();
    const badge = '<div class="badge ' + catClass + '">-' + p.cat + '-</div>';
    const altName = s.type === 'a' ? p.name : ('Mystery person ' + s.n);
    const frame = p.img2
      ? '<div class="chagal-frame-dual">'
          + '<div class="chagal-frame-half">'
            + '<img src="' + p.img + '" alt="' + esc(altName) + '">'
            + badge
          + '</div>'
          + '<div class="chagal-frame-half works">'
            + '<img src="' + p.img2 + '" alt="' + esc(p.img2Label) + '">'
            + '<div class="panel-tag">' + esc(p.img2Label) + '</div>'
          + '</div>'
        + '</div>'
      : '<div class="frame"><img src="' + p.img + '" alt="' + esc(altName) + '">' + badge + '</div>';
    const caption = s.type === 'a'
      ? '<div class="answer-tag">ANSWER ' + String(s.n).padStart(2,'0') + '</div>'
        + '<h2 class="name">' + esc(p.name) + '</h2>'
        + '<div class="credit">' + esc(p.credit) + '</div>'
      : '<div class="prompt">WHO IS THIS — Q' + String(s.n).padStart(2,'0') + '</div>';
    return '<div class="slide pic-slide">'
      + '<div class="frame-wrap">'
        + frame
        + '<div class="click-zone left" data-dir="-1"></div>'
        + '<div class="click-zone right" data-dir="1"></div>'
      + '</div>'
      + '<div class="caption">' + caption + '</div>'
      + '</div>';
  }

  function slideHTML(s){
    if (s.type === 'end') return endSlideHTML();
    const round = ROUNDS[s.ri];
    if (s.type === 'title') return round.title;
    if (s.type === 'divider') return dividerHTML();
    return round.kind === 'picture' ? chagalSlideHTML(s) : quizSlideHTML(s);
  }

  function renderDots(s){
    dotsEl.innerHTML = '';
    if (s.ri == null){
      hintEl.textContent = 'You’ve reached the end · ← to look back';
      return;
    }
    hintEl.textContent = '← → or tap the edges to move · click a dot to jump';
    const start = roundStart[s.ri];
    for (let i = 0; i < ROUND_LEN; i++){
      const globalIdx = start + i;
      const gs = SLIDES[globalIdx];
      const b = document.createElement('button');
      b.className = 'dot';
      if (gs.type === 'q' || gs.type === 'a') b.classList.add(gs.type);
      if (i === 1 || i === 11) b.classList.add('gap-before');
      if (globalIdx === idx) b.classList.add('current');
      b.setAttribute('aria-label', 'Go to slide ' + (i+1) + ' of round ' + (s.ri+1));
      b.addEventListener('click', () => { idx = globalIdx; render(); });
      dotsEl.appendChild(b);
    }
  }

  function buildRoundMenu(){
    roundMenu.innerHTML = ROUNDS.map((r,ri) =>
      '<button type="button" class="round-menu-item" data-ri="' + ri + '" role="menuitem">'
        + '<span class="rn">' + String(ri+1).padStart(2,'0') + '</span>'
        + '<span class="rl">' + esc(r.label) + '</span>'
      + '</button>'
    ).join('');
    roundMenu.querySelectorAll('.round-menu-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const ri = parseInt(btn.dataset.ri, 10);
        idx = roundStart[ri];
        render();
      });
    });
  }

  function openRoundMenu(){
    const s = SLIDES[idx];
    roundMenu.querySelectorAll('.round-menu-item').forEach(btn => {
      btn.classList.toggle('current', s.ri != null && parseInt(btn.dataset.ri,10) === s.ri);
    });
    roundMenu.hidden = false;
    roundTag.setAttribute('aria-expanded','true');
  }

  function closeRoundMenu(){
    roundMenu.hidden = true;
    roundTag.setAttribute('aria-expanded','false');
  }

  roundTag.addEventListener('click', (e) => {
    e.stopPropagation();
    if (roundMenu.hidden) openRoundMenu(); else closeRoundMenu();
  });
  roundMenu.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => { if (!roundMenu.hidden) closeRoundMenu(); });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !roundMenu.hidden){ closeRoundMenu(); }
  });
  buildRoundMenu();

  function render(){
    player.pause();
    closeRoundMenu();

    const s = SLIDES[idx];
    stage.innerHTML = slideHTML(s);

    const totalDigits = String(SLIDES.length).length;
    counter.textContent = String(idx+1).padStart(totalDigits,'0') + ' / ' + SLIDES.length;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === SLIDES.length - 1;

    const round = (s.ri != null) ? ROUNDS[s.ri] : null;
    brandEl.innerHTML = round ? round.brand : FINALE_BRAND;
    roundTag.textContent = round ? ('ROUND ' + (s.ri+1) + ' OF ' + ROUNDS.length) : 'THE END';
    roundTag.style.display = round ? '' : 'none';

    let accent = 'var(--text-dim)';
    if (s.type === 'q') accent = 'var(--gold)';
    else if (s.type === 'a') accent = 'var(--teal)';
    app.style.setProperty('--accent', accent);
    accentRule.style.background = accent;
    const brandSep = document.getElementById('brandSep');
    if (brandSep) brandSep.style.color = accent;

    const playBtn = stage.querySelector('.play-btn');
    if (playBtn){
      playBtn.addEventListener('click', () => {
        const track = playBtn.dataset.track;
        if (playerTrack === track && !player.paused){
          player.pause();
        } else {
          if (playerTrack !== track){
            player.src = track;
            playerTrack = track;
          }
          player.play().catch(()=>{});
        }
      });
      updatePlayButton();
    }

    stage.querySelectorAll('.click-zone').forEach(z => {
      z.addEventListener('click', () => go(parseInt(z.dataset.dir,10)));
    });

    renderDots(s);
  }

  function go(delta){
    const next = idx + delta;
    if (next < 0 || next >= SLIDES.length) return;
    idx = next;
    render();
  }

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.classList && e.target.classList.contains('play-btn')) return;
    if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); go(1); }
    else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
    else if (e.key === 'Home'){ e.preventDefault(); idx = 0; render(); }
    else if (e.key === 'End'){ e.preventDefault(); idx = SLIDES.length - 1; render(); }
  });

  let touchX = null;
  app.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, {passive:true});
  app.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 44) go(dx < 0 ? 1 : -1);
    touchX = null;
  }, {passive:true});

  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen?.().catch(()=>{});
    } else {
      document.exitFullscreen?.().catch(()=>{});
    }
  });

  render();
})();
</script>
